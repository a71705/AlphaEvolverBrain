# Docker Compose 文件版本。建议使用较新的版本以支持更多功能。
version: '3.8'

# 定义服务 (services)，即应用的不同组件容器。
services:
  # Web 服务：运行 FastAPI 应用的容器。
  web:
    # 构建指令：指定 Dockerfile 的位置。
    # '.' 表示 Dockerfile 在当前目录 (与 docker-compose.yml 同级)。
    build: .
    # 端口映射：将主机的 8000 端口映射到容器的 8000 端口。
    # 格式：HOST_PORT:CONTAINER_PORT
    ports:
      - "8000:8000"
    # 环境变量：为服务设置环境变量。
    # 这些变量可以在应用代码中通过 os.environ.get() 读取。
    environment:
      # REDIS_URL: 指定 Redis 服务的连接地址。
      # 'redis' 是下面定义的 Redis 服务的名称，Docker Compose 会处理网络解析。
      # '6379' 是 Redis 的默认端口。
      # '/0' 是 Redis 的默认数据库编号。
      REDIS_URL: "redis://redis:6379/0"
      # 后续任务中可能会添加其他环境变量，例如数据库连接、API 密钥等。
    # 依赖关系：定义服务启动的依赖顺序。
    # web 服务将在 redis 服务启动之后再启动。
    depends_on:
      - redis
    # 重启策略：定义容器在退出时的重启行为。
    # 'unless-stopped' 表示除非手动停止，否则容器总是在退出后重启。
    restart: unless-stopped
    # 卷挂载 (可选，如果需要实时代码更新且 Dockerfile 中 CMD 使用 --reload):
    # 将本地的 ./app 目录挂载到容器内的 /app/app 目录。
    # 这样在本地修改代码后，Uvicorn 的 --reload 可以检测到变化并自动重启。
    # 注意：如果 Dockerfile 中的 COPY . . 已经复制了整个应用，
    # 并且 CMD 使用了 --reload，这个卷挂载主要用于开发时的即时反馈。
    # 对于生产环境，通常不挂载应用代码卷，而是构建包含最新代码的镜像。
    # volumes:
    #   - ./app:/app/app # 根据实际项目结构调整

  # Redis 服务：运行 Redis 数据库的容器。
  redis:
    # 镜像：指定要使用的 Docker 镜像。
    # 'redis:latest' 表示使用 Redis 官方的最新版本镜像。
    image: "redis:latest"
    # 卷挂载：将命名卷 'redis_data' 挂载到容器的 '/data' 目录。
    # '/data' 是 Redis 默认的数据持久化目录。
    # 这样可以确保 Redis 数据在容器重启或删除后依然存在。
    volumes:
      - redis_data:/data # 将 redis_data 卷挂载到容器的 /data 目录
    # 重启策略：与 web 服务类似。
    restart: unless-stopped

  # Worker 服务：运行 RQ (Redis Queue) Worker 的容器，用于处理后台任务。
  worker:
    # 构建指令：与 web 服务使用相同的 Dockerfile。
    # worker 也需要 Python 环境和项目依赖。
    build: .
    # 命令：覆盖 Dockerfile 中的 CMD 指令。
    # ["tail", "-f", "/dev/null"] 是一个占位命令，使容器保持运行状态。
    # 在 DEV-013 任务中，这个命令会被替换为实际启动 RQ worker 的命令。
    command: ["tail", "-f", "/dev/null"] # 占位命令，稍后会更新为 RQ worker 命令
    # 环境变量：与 web 服务类似，worker 也需要连接到 Redis。
    environment:
      REDIS_URL: "redis://redis:6379/0"
      # 后续可能会添加其他 worker 特定的环境变量。
    # 依赖关系：worker 服务依赖于 redis 和 web 服务。
    # web 服务可能包含数据库迁移等初始化操作，worker 可能需要等待其完成。
    depends_on:
      - redis
      - web
    # 重启策略：与 web 服务类似。
    restart: unless-stopped

# 定义命名卷 (named volumes)，用于数据持久化。
volumes:
  # redis_data 卷：用于 Redis 服务持久化数据。
  # Docker 会管理这个卷的生命周期。
  redis_data:
