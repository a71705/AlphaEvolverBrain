# Docker Compose 文件版本。建议使用较新的版本以支持更多功能。
version: '3.8'

# 定义服务 (services)，即应用的不同组件容器。
services:
  # Web 服务：运行 FastAPI 应用的容器。
  web:
    # 构建指令：指定 Dockerfile 的位置。
    # '.' 表示 Dockerfile 在当前目录 (与 docker-compose.yml 同级)。
    build: .
    # 端口映射：将主机的 8000 端口映射到容器的 8000 端口。
    # 格式：HOST_PORT:CONTAINER_PORT
    ports:
      - "8000:8000"
    # 环境变量：为服务设置环境变量。
    # 这些变量可以在应用代码中通过 os.environ.get() 读取。
    environment:
      # REDIS_URL: 指定 Redis 服务的连接地址。
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "sqlite:///./data/alpha_evolution.db"
      LOG_LEVEL: "INFO"
      # WorldQuant Brain API 凭据 (占位符)
      # 重要：这些是占位符值，请勿在生产中直接使用或提交到版本控制。
      # 生产环境中应通过 Docker Secrets, HashiCorp Vault, GCP Secret Manager 等安全方式注入。
      BRAIN_CREDENTIAL_EMAIL: "your_email@example.com" # 您的 WorldQuant Brain 邮箱
      BRAIN_CREDENTIAL_PASSWORD: "your_password"       # 您的 WorldQuant Brain 密码
    # 卷挂载：将命名卷 'alpha_db_data' 挂载到容器的 '/app/data' 目录。
    # 这确保了 SQLite 数据库文件在容器重启或删除后依然存在。
    volumes:
      - alpha_db_data:/app/data
      # - ./app:/app/app # 开发时代码实时更新，根据需要启用
    # 依赖关系：定义服务启动的依赖顺序。
    depends_on:
      - redis
    # 重启策略：定义容器在退出时的重启行为。
    restart: unless-stopped

  # Redis 服务：运行 Redis 数据库的容器。
  redis:
    # 镜像：指定要使用的 Docker 镜像。
    # 'redis:latest' 表示使用 Redis 官方的最新版本镜像。
    image: "redis:latest"
    # 卷挂载：将命名卷 'redis_data' 挂载到容器的 '/data' 目录。
    # '/data' 是 Redis 默认的数据持久化目录。
    # 这样可以确保 Redis 数据在容器重启或删除后依然存在。
    volumes:
      - redis_data:/data # 将 redis_data 卷挂载到容器的 /data 目录
    # 重启策略：与 web 服务类似。
    restart: unless-stopped

  # Worker 服务：运行 RQ (Redis Queue) Worker 的容器，用于处理后台任务。
  worker:
    # 构建指令：与 web 服务使用相同的 Dockerfile。
    # worker 也需要 Python 环境和项目依赖。
    build: .
    # 命令：启动 RQ Worker。
    # "rq worker" 是 RQ 提供的命令行工具，用于启动一个 worker 进程。
    # "-u redis://redis:6379/0" 指定 RQ 连接的 Redis 数据库 URL。
    #   'redis' 是 Docker Compose 网络中 Redis 服务的名称。
    #   '6379' 是 Redis 的默认端口。
    #   '/0' 是 Redis 的默认数据库。
    # "default" (可选参数) 指定此 worker 监听名为 'default' 的队列。
    #   可以省略此参数，worker 默认会监听 'default' 队列。
    #   也可以指定多个队列名称，例如：["rq", "worker", "-u", "redis://redis:6379/0", "high", "default", "low"]
    command: ["rq", "worker", "-u", "redis://redis:6379/0", "default"]
    environment:
      REDIS_URL: "redis://redis:6379/0" # RQ worker 也需要此环境变量，虽然命令行中已指定，但代码内可能用到
      DATABASE_URL: "sqlite:///./data/alpha_evolution.db"
      LOG_LEVEL: "INFO"
      # WorldQuant Brain API 凭据 (占位符) - Worker 可能也需要访问 API
      BRAIN_CREDENTIAL_EMAIL: "your_email@example.com" # 占位符
      BRAIN_CREDENTIAL_PASSWORD: "your_password"       # 占位符
    # 卷挂载：Worker 服务也需要访问数据库文件。
    volumes:
      - alpha_db_data:/app/data
      # - ./app:/app/app # 开发时代码实时更新，根据需要启用
    depends_on:
      - redis
      - web
    restart: unless-stopped

# 定义命名卷 (named volumes)，用于数据持久化。
volumes:
  # redis_data 卷：用于 Redis 服务持久化数据。
  redis_data:
  # alpha_db_data 卷：用于 SQLite 数据库文件持久化。
  alpha_db_data:
