# Docker Compose 文件版本。建议使用较新的版本以支持更多功能。
version: '3.8'

services:
  # Web 服务: 运行 FastAPI 应用的容器
  web:
    build: . # Dockerfile 路径 (当前目录)
    container_name: worldquant_alpha_web # (可选) 容器的自定义名称
    ports:
      - "8000:8000" # 将主机的8000端口映射到容器的8000端口
    env_file:
      - ./.env # 从项目根目录的 .env 文件加载环境变量
    environment:
      # LOG_LEVEL: ${LOG_LEVEL:-INFO} # 可选: 如果 .env 中未定义 LOG_LEVEL, 则使用 INFO 作为默认值
      # 其他特定于此服务的环境变量可以在此覆盖 .env 文件中的值，但不推荐用于敏感数据
      PYTHONUNBUFFERED: 1 # 确保Python日志和print直接输出，便于Docker日志查看和调试
    volumes:
      - ./app:/app # 将本地app目录挂载到容器的/app目录 (主要用于开发时的代码热重载)
      - alpha_db_data:/app/data # SQLite数据库持久化卷 (路径应与DATABASE_URL环境变量对应)
    depends_on: # 定义服务启动依赖顺序
      - redis
      # 如果使用外部数据库服务 (如PostgreSQL)，应在此添加依赖:
      # - postgres_db
    restart: unless-stopped # 重启策略: 除非手动停止，否则容器在退出时会自动重启
    networks: # DEV-035: 明确指定网络，确保所有服务在同一网络
      - app_network

  # Redis 服务: 用于 RQ 任务队列和可能的缓存
  redis:
    image: "redis:latest" # 使用官方最新的 Redis 镜像
    container_name: worldquant_alpha_redis
    ports: # 通常Redis不直接暴露给主机，除非有特定调试需求或外部访问需求
      - "6379:6379" # 仅用于本地开发调试。生产环境通常不应暴露 Redis 端口到公网。
    volumes:
      - redis_data:/data # Redis 数据持久化卷
    restart: unless-stopped
    networks:
      - app_network

  # Worker 服务: 运行 RQ (Redis Queue) Worker，处理后台任务 (如遗传算法)
  worker:
    build: . # 与 web 服务使用相同的 Dockerfile
    container_name: worldquant_alpha_worker
    # command: 指定容器启动时执行的命令。
    # -u ${REDIS_URL:-redis://redis:6379/0}: Worker 连接到的 Redis URL。
    #   使用环境变量插值，如果 REDIS_URL 在 .env 文件中定义，则使用该值；否则使用默认值。
    # "default-queue" "high-priority-queue": Worker 监听的队列名称列表。
    command: ["rq", "worker", "-u", "${REDIS_URL:-redis://redis:6379/0}", "default-queue", "high-priority-queue"]
    env_file:
      - ./.env # 从 .env 文件加载环境变量
    environment:
      # LOG_LEVEL: ${LOG_LEVEL:-INFO} # 同上, 可选的默认值覆盖
      PYTHONUNBUFFERED: 1
    depends_on: # Worker 依赖 Redis 和 Web 服务
      - redis
      - web # 确保Web服务（可能负责创建DB表结构或进行其他初始化）先启动
    restart: unless-stopped
    volumes: # Worker 服务通常也需要访问应用代码和数据卷
      - ./app:/app # (主要用于开发时的代码同步)
      - alpha_db_data:/app/data # 共享数据库卷
    networks:
      - app_network

  # RQ Dashboard 服务 (用于监控 RQ 任务队列)
  rq_dashboard:
    image: "rq/rq-dashboard:latest" # 使用官方的 rq-dashboard 镜像
    container_name: worldquant_alpha_rq_dashboard
    ports:
      - "9181:9181" # 仪表盘访问端口: 主机端口:容器端口
    environment:
      # RQ_REDIS_URL: RQ Dashboard 连接 Redis 所需的 URL。
      # 此处直接使用 redis 服务名，因为它在同一个 Docker 网络中。
      # 使用环境变量插值，如果 REDIS_URL 在 .env 中定义，则优先使用该值。
      RQ_REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    depends_on:
      - redis # 依赖 Redis 服务
    restart: unless-stopped
    networks:
      - app_network

# 定义命名卷 (named volumes)，用于数据持久化
# 使用 local驱动，表示数据存储在运行 Docker 的主机的特定目录中 (由 Docker 管理)
volumes:
  redis_data: # Redis 数据卷声明
    driver: local
  alpha_db_data: # SQLite 数据库文件卷声明 (或其他数据库数据)
    driver: local

# 定义自定义网络 (networks)
# 确保所有需要相互通信的服务都在同一个自定义网络中。
# Docker Compose 默认会创建一个网络，但显式定义可以提供更好的控制和可读性。
networks:
  app_network: # 自定义网络的名称
    driver: bridge # 使用默认的 bridge 网络驱动
    name: wq_alpha_evolution_network # (可选) 在 Docker 主机上实际创建的网络名称。不指定则自动生成。
