# docker-compose.yml
# Docker Compose 文件版本定义
version: '3.8' # 指定 docker-compose 文件格式的版本

# 定义服务 (services)
# 每个服务对应一个容器
services:
  # Web 服务 (FastAPI 应用)
  web:
    # 构建指令 (build)
    # context: '.' 表示 Dockerfile 位于当前目录 (项目根目录)
    build: .
    # 端口映射 (ports)
    # 将主机的 8000 端口映射到容器的 8000 端口
    # 格式: "HOST:CONTAINER"
    ports:
      - "8000:8000"
    # 环境变量 (environment)
    # 设置容器内部的环境变量
    environment:
      # REDIS_URL: 指定 Redis 服务的连接地址
      REDIS_URL: "redis://redis:6379/0"
      # DATABASE_URL: SQLite 数据库文件的路径
      DATABASE_URL: "sqlite:///./data/alpha_evolution.db"
      # LOG_LEVEL: 应用的日志级别
      LOG_LEVEL: "INFO"
      # 新增: WorldQuant Brain API 凭据 (本地开发/测试占位符)
      # 重要: 请将以下值替换为您的真实凭据进行本地测试。
      # 警告: 请勿将真实凭据硬编码提交到版本控制系统。
      # 生产环境中应使用 Docker Secrets 或安全的外部环境变量注入方式。
      BRAIN_CREDENTIAL_EMAIL: "your_email@example.com" # 您的 WorldQuant Brain 邮箱
      BRAIN_CREDENTIAL_PASSWORD: "your_password"       # 您的 WorldQuant Brain 密码
    # 依赖关系 (depends_on)
    depends_on:
      - redis
    # 重启策略 (restart)
    restart: unless-stopped
    # 卷挂载 (volumes)
    volumes:
      - alpha_db_data:/app/data

  # Redis 服务
  redis:
    # 镜像 (image)
    image: "redis:latest"
    # 卷挂载 (volumes)
    volumes:
      - redis_data:/data # Redis 数据持久化卷
    # 重启策略 (restart)
    restart: unless-stopped

  # Worker 服务 (RQ Worker - Redis Queue Worker)
  worker:
    # 构建指令 (build)
    build: .
    # 启动命令 (command)
    command: ["tail", "-f", "/dev/null"] # 占位符命令
    # 环境变量 (environment)
    environment:
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "sqlite:///./data/alpha_evolution.db"
      LOG_LEVEL: "INFO"
      # 新增: WorldQuant Brain API 凭据 (与 web 服务相同)
      # 重要: 请将以下值替换为您的真实凭据进行本地测试。
      # 警告: 请勿将真实凭据硬编码提交到版本控制系统。
      # 生产环境中应使用 Docker Secrets 或安全的外部环境变量注入方式。
      BRAIN_CREDENTIAL_EMAIL: "your_email@example.com" # 您的 WorldQuant Brain 邮箱
      BRAIN_CREDENTIAL_PASSWORD: "your_password"       # 您的 WorldQuant Brain 密码
    # 依赖关系 (depends_on)
    depends_on:
      - redis
      - web
    # 重启策略 (restart)
    restart: unless-stopped
    # 卷挂载 (volumes)
    volumes:
      - alpha_db_data:/app/data

# 定义具名卷 (volumes)
volumes:
  redis_data:
  alpha_db_data:
