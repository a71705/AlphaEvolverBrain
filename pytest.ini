# pytest.ini
[pytest]
# --通用选项--
minversion = 6.0 # 最低pytest版本要求
# addopts = --strict-markers -ra -q # 严格标记模式, -ra显示失败和通过的摘要, -q安静模式
addopts = -ra -q --cov=app --cov-report=term-missing --cov-report=html # -ra显示失败和跳过测试的额外信息, -q安静模式减少冗余输出, 激活覆盖率
testpaths = tests # 指定测试文件搜索路径 (相对于项目根目录)
python_files = test_*.py # 指定测试文件名模式
python_classes = Test* # 指定测试类名模式 (如果使用类组织测试)
python_functions = test_* # 指定测试函数名模式

# --覆盖率配置 (pytest-cov)--
# --cov=app: 指定要计算覆盖率的应用模块/包名 (这里是 'app')
# --cov-report=term-missing: 在终端输出覆盖率报告，并显示缺失的行号
# --cov-report=html: 生成 HTML 格式的覆盖率报告 (通常在 htmlcov/ 目录下)
# (注意: addopts 中已包含覆盖率参数)

# --日志配置 (可选, 控制测试期间日志级别)--
# log_cli = true: 在测试运行时实时显示日志输出到控制台
log_cli = true
# log_cli_level: 控制台实时日志的级别 (DEBUG, INFO, WARNING, ERROR, CRITICAL)
log_cli_level = INFO
# log_level = DEBUG # 如果需要更详细的日志写入到 pytest 的日志文件或报告中

# --异步测试配置 (pytest-asyncio，如果使用)--
# 'auto': 自动检测异步测试函数并使用asyncio运行器
# 'strict': 要求显式使用 @pytest.mark.asyncio 标记异步测试
asyncio_mode = auto

# --环境变量 (可选, 为测试设置特定环境变量)--
# 可以在这里设置只在测试期间有效的环境变量
# env =
#   TESTING_MODE=true
#   SOME_OTHER_TEST_CONFIG=test_value
#   # 例如，可以覆盖 .env 文件中的某些设置，或提供测试专用的数据库URL等
#   # SQLALCHEMY_DATABASE_URL=sqlite:///./test_db_for_pytest.db # 如果不想在 conftest.py 硬编码
